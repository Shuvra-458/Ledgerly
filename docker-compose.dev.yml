services:
  mongo:
    ports:
      - "27017:27017"          # expose for local tools (Compass, mongosh)

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ft_mongo_express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"    # dev only!
    ports:
      - "8081:8081"
    networks:
      - ft_net

  app:
    build:
      context: .
      target: development
    container_name: ft_app_dev
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
    volumes:
      - .:/app                     # bind mount source
      - /app/node_modules          # anonymous volume keeps container's node_modules
    ports:
      - "3000:3000"
    command: npm run dev           # nodemon